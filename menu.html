<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASADOR COFFEE menu — signature drinks and seasonal bites." />
    <title>ASADOR COFFEE | Our Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <a href="/">
          <img src="https://asadorcoffee.com/assets/images/icons/logo.png" alt="ASADOR COFFEE" class="brand__logo" />
        </a>
        <div class="brand__text">
          <span class="brand__name">ASADOR COFFEE</span>
          <span class="brand__tag">Artisanal Roastery</span>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="index.html" class="site-nav__link">Home</a>
        <a href="menu.html" class="site-nav__link is-active">Our Menu</a>
        <a href="about.html" class="site-nav__link">About Us</a>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <p class="eyebrow">slow bar curation</p>
        <h1>Pour-over flight, espresso lab, crafted bites.</h1>
        <p>Each drink is roasted in-house, brewed to order, and paired with thoughtful accompaniments.</p>
      </section>

      <section class="menu" id="menu">
        <div class="menu__filters" role="tablist" aria-label="Menu categories">
          <button class="chip is-active" data-category="all">All</button>
          <button class="chip" data-category="espresso">Espresso</button>
          <button class="chip" data-category="brew">Slow Brew</button>
          <button class="chip" data-category="seasonal">Seasonal</button>
          <button class="chip" data-category="food">Bites</button>
        </div>
        <div class="menu__grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> ASADOR COFFEE. Crafted in small batches.</p>
    </footer>

    <script src="js/main.js" type="module"></script>
    <script type="module" src="js/menu.js"></script>
  </body>
</html>
